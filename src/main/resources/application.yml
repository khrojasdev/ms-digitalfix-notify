spring:
  application:
    name: ms-digitalfix-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

# Nomenclatura centralizada de la mensajeria (exigencia de la pauta):
# ningun nombre de cola, exchange o routing key se escribe a mano en el codigo.
amqp:
  exchange:
    negocio: ordenes.negocio.exchange
    stock: catalogo.stock.exchange
  queue:
    avisos: ordenes.avisos.queue
    avisos-dlq: ordenes.avisos.dlq
    stock: notify.stock.queue
    stock-dlq: notify.stock.dlq
  routing-key:
    avisos: ordenes.eventos.*
    stock-bajo-minimo: stock.bajo-minimo
  # Fallas transitorias: cuantas veces se intenta y la espera inicial, que se
  # duplica en cada intento. Ver mensajeria.ProcesadorDeMensajes.
  reintentos:
    maximo: 3
    espera-ms: 1000

server:
  port: ${PUERTO:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacion:-sin-correlacion}] %logger{36} - %msg%n"
